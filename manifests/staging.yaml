_metadata:
  major_version: 2
display_information:
  name: "Datalayer Staging"
  description: Ask your Datalayer agents and applications from Slack.
  background_color: "#24292f"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  assistant_view:
    assistant_description: Ask your Datalayer application. Its suggested prompts are the application's own.
  bot_user:
    display_name: "Datalayer Staging"
    always_online: true
oauth_config:
  redirect_urls:
    - "https://slack-staging.datalayer.run/slack/oauth/callback"
  scopes:
    bot:
      - app_mentions:read
      - assistant:write
      - chat:write
      - im:history
      - users:read
settings:
  event_subscriptions:
    request_url: "https://slack-staging.datalayer.run/slack/events"
    bot_events:
      - agent_session_stopped
      - app_home_opened
      - app_mention
      - app_uninstalled
      - assistant_thread_started
      - message.im
      - tokens_revoked
  interactivity:
    is_enabled: true
    request_url: "https://slack-staging.datalayer.run/slack/events"
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: true
