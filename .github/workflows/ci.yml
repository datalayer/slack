name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: slack
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SLACK_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/slack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
      # No lockfile is kept (the monorepo's rule): the exact versions of
      # package.json are installed. agent-runtimes is an optional peer, never
      # installed whole: its pinned release's lib/portable is extracted after
      # the install (plans/DISCORD.md §4.2, DC-004).
      - run: npm install --no-audit --no-fund
      - name: agent-runtimes' lib/portable (config.agentRuntimesVersion)
        run: npm run fetch:agent-runtimes
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Strict TypeScript
        run: npm run typecheck
      - name: The bundle graph (sources and agent-runtimes' lib/portable only)
        run: npm run check:imports
      - name: The installed graph of the bundle's externals
        run: npm run check:installed
      - name: Manifest drift
        run: npm run manifest:check
      - name: Tests (memory and Postgres stores)
        run: npm test
      - name: Bundle
        run: npm run bundle
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks, the whole history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --no-banner -v

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Container build
        run: docker build -t datalayer-slack:ci .
      - name: The image runs as a non-root user and serves /healthz
        run: |
          test "$(docker run --rm --entrypoint id datalayer-slack:ci -u)" != "0"
          docker run -d --name slack -p 3000:3000 \
            -e NODE_ENV=test -e DATALAYER_SLACK_TRANSPORT=http -e DATALAYER_DELIVERY_POLL_SECONDS=0 \
            -e SLACK_SIGNING_SECRET=ci-only-signing-secret -e SLACK_CLIENT_ID=1.2 -e SLACK_CLIENT_SECRET=ci-only \
            -e SLACK_STATE_SECRET=ci-only-state-secret-0123456789abcdef \
            -e SLACK_REDIRECT_URI=https://slack.example/slack/oauth/callback \
            datalayer-slack:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz; then curl -fsS http://127.0.0.1:3000/readyz; exit $?; fi
            sleep 1
          done
          docker logs slack; exit 1
